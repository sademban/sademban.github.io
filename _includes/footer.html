{%- comment -%}
Footer component with copyright and RSS subscription
{%- endcomment -%}
<footer class="site-footer">
  <div class="container">
    <div class="footer-content">
      <div class="footer-left">
        <p class="copyright">
          © {{ "now" | date: "%Y" }} {{ site.author | default: site.title }}. All rights reserved.
        </p>
      </div>
      <div class="footer-right">
        <div class="rss-subscribe">
          <a href="{{ "/feed.xml" | relative_url }}" class="rss-link" title="Subscribe to RSS feed">
            <svg class="rss-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M4 11C6.38 11 8.47 11.94 10 13.47C11.53 15 12.47 17.09 12.47 19.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M4 4C8.97 4 13.18 6.03 16.24 9.24C19.25 12.45 21 16.91 21 21.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="5" cy="19" r="1" fill="currentColor"/>
            </svg>
            Subscribe via RSS
          </a>
        </div>
      </div>
    </div>
  </div>
</footer>
